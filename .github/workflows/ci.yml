name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Smoke-test the CLI on synthetic data
        run: |
          btcbot synth --rows 1500
          btcbot train --data data/synthetic.csv --model logreg --splits 3 --holdout 90
          btcbot paper --data data/synthetic.csv --replay 90
